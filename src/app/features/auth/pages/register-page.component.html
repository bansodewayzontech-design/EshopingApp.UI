<main class="grid min-h-screen bg-[#fffdfa] lg:grid-cols-[0.9fr_1.1fr]">
  <section class="grid place-items-center px-5 py-10 sm:px-8">
    <div class="w-full max-w-md">
      <a routerLink="/" class="font-display text-2xl text-[#542636]">Eshoping<span class="text-[#b17b3a]">.</span></a>
      <p class="mt-8 text-[10px] font-semibold uppercase tracking-[0.18em] text-[#8d5b50]">Make yourself at home</p>
      <h1 class="mt-2 font-display text-4xl text-[#302927]">Create account</h1>
      <p class="mt-2 text-sm text-[#786a64]">A local demo account keeps your profile on this device.</p>
      <form class="mt-7 space-y-4" (submit)="register($event)">
        <label class="block text-xs font-semibold text-[#453c39]">Full name<input name="fullName" autocomplete="name" required minlength="2" class="mt-1.5 min-h-12 w-full border border-[#d9c9c1] px-3 text-sm outline-none focus:border-[#6f1d35]" /></label>
        <label class="block text-xs font-semibold text-[#453c39]">Email address<input name="email" type="email" autocomplete="email" required class="mt-1.5 min-h-12 w-full border border-[#d9c9c1] px-3 text-sm outline-none focus:border-[#6f1d35]" /></label>
        <label class="block text-xs font-semibold text-[#453c39]">Mobile number<input name="phone" type="tel" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" required class="mt-1.5 min-h-12 w-full border border-[#d9c9c1] px-3 text-sm outline-none focus:border-[#6f1d35]" /></label>
        <label class="block text-xs font-semibold text-[#453c39]">Password<span class="relative mt-1.5 block"><input name="password" aria-label="Password" [type]="showPassword() ? 'text' : 'password'" autocomplete="new-password" required minlength="6" class="min-h-12 w-full border border-[#d9c9c1] px-3 pr-14 text-sm outline-none focus:border-[#6f1d35]" /><button type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 px-3 text-[10px] font-semibold uppercase tracking-wide text-[#6f1d35]">{{ showPassword() ? 'Hide' : 'Show' }}</button></span></label>
        <label class="block text-xs font-semibold text-[#453c39]">Confirm password<input name="confirmPassword" aria-label="Confirm password" [type]="showPassword() ? 'text' : 'password'" autocomplete="new-password" required minlength="6" class="mt-1.5 min-h-12 w-full border border-[#d9c9c1] px-3 text-sm outline-none focus:border-[#6f1d35]" /></label>
        @if (errorMessage()) { <p class="text-xs text-[#8d263d]" role="alert">{{ errorMessage() }}</p> }
        <button type="submit" class="min-h-12 w-full bg-[#6f1d35] px-4 text-xs font-bold uppercase tracking-[0.12em] text-white transition hover:bg-[#542636]">Create account</button>
      </form>
      <p class="mt-6 text-center text-sm text-[#786a64]">Already have an account? <a routerLink="/auth/login" class="font-semibold text-[#6f1d35] hover:underline">Sign in</a></p>
    </div>
  </section>
  <aside class="relative hidden overflow-hidden bg-[#542636] lg:block"><img src="https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=1400&q=82" alt="A saree chosen for a special occasion" class="absolute inset-0 h-full w-full object-cover opacity-55" /><div class="absolute inset-0 bg-gradient-to-t from-[#351620]/70 to-transparent"></div><p class="absolute bottom-12 left-12 max-w-md font-display text-5xl leading-tight text-white">Find the drape that feels like you.</p></aside>
</main>

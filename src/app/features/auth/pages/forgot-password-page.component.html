<main class="grid min-h-screen place-items-center bg-[#fbf6f0] px-5 py-10">
  <section class="w-full max-w-md border border-[#eee5df] bg-white p-6 shadow-sm sm:p-9">
    <a routerLink="/" class="font-display text-2xl text-[#542636]">Eshoping<span class="text-[#b17b3a]">.</span></a>
    <span class="mt-8 grid h-12 w-12 place-items-center rounded-full bg-[#f7f2ed] text-[#6f1d35]"><app-icon name="mail" [size]="21" /></span>
    <p class="mt-6 text-[10px] font-semibold uppercase tracking-[0.18em] text-[#8d5b50]">Account help</p>
    <h1 class="mt-2 font-display text-3xl text-[#302927]">Forgot password?</h1>
    <p class="mt-2 text-sm leading-6 text-[#786a64]">Enter the email address associated with your account. This demo does not send email or change passwords.</p>
    <form class="mt-6" (submit)="requestReset($event)">
      <label class="block text-xs font-semibold text-[#453c39]">Email address<input name="email" type="email" autocomplete="email" required class="mt-1.5 min-h-12 w-full border border-[#d9c9c1] px-3 text-sm outline-none focus:border-[#6f1d35]" /></label>
      <button type="submit" class="mt-4 min-h-12 w-full bg-[#6f1d35] px-4 text-xs font-bold uppercase tracking-[0.12em] text-white">Continue</button>
      @if (message()) { <p class="mt-4 border border-[#eee5df] bg-[#fbf8f4] p-3 text-xs leading-5 text-[#542636]" role="status">{{ message() }}</p> }
    </form>
    <a routerLink="/auth/login" class="mt-6 inline-flex min-h-10 items-center gap-2 text-xs font-medium text-[#6f1d35]"><app-icon name="arrow-left" [size]="15" /> Back to sign in</a>
  </section>
</main>

<div class="h-full snap-y snap-mandatory overflow-y-auto overscroll-contain [scrollbar-width:none]" role="region" aria-label="Viral saree video feed" tabindex="0" (wheel)="onWheel($event)" (keydown)="onKeydown($event)">
  @for (video of videos; track video.videoId; let index = $index) {
    <article #feedCard [attr.data-index]="index" class="relative h-[100dvh] snap-start snap-always bg-[#171214]">
      <div class="relative mx-auto h-full w-full max-w-[480px] overflow-hidden bg-black sm:border-x sm:border-white/10">
        <app-video-player
          class="absolute inset-0"
          [videoUrl]="video.videoUrl"
          [posterUrl]="video.thumbnailUrl"
          [active]="activeIndex === index"
          [muted]="muted"
          (muteToggle)="muteToggle.emit()"
        />
        <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/20"></div>
        <div class="absolute bottom-7 left-4 right-32 z-10 sm:left-6 sm:right-36">
          <app-video-product-info [video]="video" />
        </div>
        <div class="absolute bottom-6 right-3 z-20 w-[108px] sm:right-4">
          <app-video-actions
            [liked]="isLiked(video.productId)"
            (like)="like.emit(video)"
            (share)="share.emit(video)"
            (details)="details.emit(video)"
            (buy)="buy.emit(video)"
            (add)="add.emit(video)"
          />
        </div>
        @if (video.isViral) {
          <span class="absolute left-4 top-20 z-10 inline-flex items-center gap-1.5 border border-white/30 bg-black/35 px-3 py-1.5 text-[9px] font-bold uppercase tracking-[0.16em] text-white backdrop-blur-sm sm:left-6">
            <app-icon name="flame" [size]="14" class="text-[#ff8757]" /> Trending now
          </span>
        }
      </div>
    </article>
  }
</div>

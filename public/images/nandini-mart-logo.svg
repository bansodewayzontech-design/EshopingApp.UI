      <feOffset dy="5" />
      <feComponentTransfer><feFuncA type="linear" slope=".2" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="floral-border" width="54" height="42" patternUnits="userSpaceOnUse">

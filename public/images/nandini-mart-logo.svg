<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Nandini Mart</title>
  <desc id="logo-description">A woman in a crimson saree over a golden N and lotus, with the Nandini Mart wordmark.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">

      <stop offset=".24" stop-color="#e4b84f" />
      <stop offset=".5" stop-color="#fff0a0" />
      <stop offset=".74" stop-color="#c58b2f" />
      <stop offset="1" stop-color="#f6d875" />
    </linearGradient>
    <linearGradient id="gold-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d875" />
      <stop offset="1" stop-color="#9a601d" />
    </linearGradient>
    <linearGradient id="saree" x1=".2" y1="0" x2=".8" y2="1">

      <stop offset=".45" stop-color="#e22a28" />
      <stop offset=".72" stop-color="#b40919" />
      <stop offset="1" stop-color="#78101c" />
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
